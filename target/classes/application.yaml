spring:
  application:
    name: java-microservices-template

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/templatedb
    username: template_user
    password: template_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # MongoDB
  data:
    mongodb:
      uri: mongodb://localhost:27017/templatedb

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: template-group
      auto-offset-reset: earliest

  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: template_user
    password: template_pass

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info